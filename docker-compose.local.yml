services:
  postgres:
    image: postgres:17-alpine
    container_name: playermaster-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: playermaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - playermaster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playermaster"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  playermaster_postgres_data:
